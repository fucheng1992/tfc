name: Update publications

on:
  schedule:
    - cron: '30 0 * * *'  # 每天 UTC 00:30
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: refresh publications
        run: |
          python update_publications.py --id Pb-GVZQAAAAJ --max 100

      - name: Commit and push publications update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          if ! git diff --cached --quiet -- publications.json; then
            git commit -m "Sync Scholar publications via GitHub Actions"
            git push origin master
          else
            echo "No publication updates"
          fi
        env:
          GITHUB_TOKEN: 
